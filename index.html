<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Mini App</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Telegram ranglariga moslashuvchi dizayn */
        body { 
            font-family: Arial, sans-serif; 
            text-align: center; 
            padding: 20px; 
            background: var(--bg-color, #ffffff); 
            color: var(--text-color, #000000); 
        }
        button { 
            background: var(--button-color, #3390ec); 
            color: var(--button-text-color, #ffffff); 
            border: none; 
            padding: 12px 24px; 
            font-size: 16px; 
            border-radius: 8px; 
            cursor: pointer; 
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Salom, Telegram!</h1>
    <p>Sizning ismingiz: <span id="username">Mehmon</span></p>
    <button onclick="sendData()">Botga ma'lumot yuborish</button>

    <script>
        // Telegram Web App ob'ektini chaqirish
        let tg = window.Telegram.WebApp;
        tg.expand(); // Ilovani to'liq ekran qilish
        tg.ready();  // Ilovani tayyorlash

        // Foydalanuvchi ismini olish
        let user = tg.initDataUnsafe.user;
        if (user) {
            document.getElementById('username').innerText = user.first_name;
        }

        // Botga ma'lumot yuborish funksiyasi
        function sendData() {
            tg.sendData("Foydalanuvchi tugmani bosdi!");
            // tg.close(); // Agar kerak bo'lsa, ilovani yopish
        }
    </script>
</body>
</html>
