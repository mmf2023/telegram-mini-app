<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Расписание Мечети</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #ffffff);
            --text-color: var(--tg-theme-text-color, #000000);
            --hint-color: var(--tg-theme-hint-color, #999999);
            --button-color: var(--tg-theme-button-color, #3390ec);
            --button-text-color: var(--tg-theme-button-text-color, #ffffff);
            --secondary-bg-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--secondary-bg-color);
            color: var(--text-color);
            padding-bottom: 70px;
        }

        .header {
            background-color: var(--button-color);
            color: var(--button-text-color);
            padding: 15px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .container {
            padding: 15px;
        }

        .today-card {
            background-color: var(--bg-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .today-date {
            text-align: center;
            font-size: 16px;
            color: var(--hint-color);
            margin-bottom: 15px;
        }

        .role-block {
            display: flex;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid var(--secondary-bg-color);
        }

        .role-block:last-child {
            border-bottom: none;
        }

        .role-icon {
            font-size: 28px;
            margin-right: 15px;
            width: 40px;
            text-align: center;
        }

        .role-info {
            flex: 1;
        }

        .role-title {
            font-size: 13px;
            color: var(--hint-color);
            margin-bottom: 5px;
        }

        .role-name {
            font-size: 20px;
            font-weight: 600;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: var(--bg-color);
            display: flex;
            border-top: 1px solid var(--secondary-bg-color);
            padding: 10px 0;
            z-index: 100;
        }

        .nav-btn {
            flex: 1;
            background: none;
            border: none;
            color: var(--hint-color);
            font-size: 14px;
            font-weight: 600;
            padding: 8px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: color 0.2s;
        }

        .nav-btn.active {
            color: var(--button-color);
        }

        .nav-icon {
            font-size: 24px;
            margin-bottom: 4px;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="header" id="header-title">📅 Расписание на сегодня</div>

    <!-- 1-MENU: Imam va Muazzin -->
    <div id="page-prayer" class="container">
        <div class="today-card">
            <div class="today-date" id="today-date-text">Загрузка...</div>
            
            <div class="role-block">
                <div class="role-icon">👳‍♂️</div>
                <div class="role-info">
                    <div class="role-title">Имам (И)</div>
                    <div class="role-name" id="today-imom">-</div>
                </div>
            </div>

            <div class="role-block">
                <div class="role-icon">🎙️</div>
                <div class="role-info">
                    <div class="role-title">Муаззин (М)</div>
                    <div class="role-name" id="today-muazzin">-</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 2-MENU: Oshxona navbatchilari -->
    <div id="page-kitchen" class="container hidden">
        <div class="today-card">
            <div class="today-date" id="kitchen-date-text">Загрузка...</div>
            
            <div class="role-block">
                <div class="role-icon">🍽️</div>
                <div class="role-info">
                    <div class="role-title">Навбатчики кухни</div>
                    <div class="role-name" id="kitchen-number">№ -</div>
                </div>
            </div>

            <div class="role-block">
                <div class="role-icon"></div>
                <div class="role-info">
                    <div class="role-title">Ответственные</div>
                    <div class="role-name" id="kitchen-names">-</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Pastki menyu -->
    <nav class="bottom-nav">
        <button class="nav-btn active" onclick="switchPage('prayer')">
            <span class="nav-icon">🕌</span>
            Имамы
        </button>
        <button class="nav-btn" onclick="switchPage('kitchen')">
            <span class="nav-icon">🍽️</span>
            Кухня
        </button>
    </nav>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        // ================= MA'LUMOTLAR =================
        
        // Imon va Muazzinlar jadvali
        const prayerSchedule = [
            { date: "19.10", imom: "Абдулла", muazzin: "Безирген" },
            { date: "20.10", imom: "Усман", muazzin: "Абу Бакр" },
            { date: "21.10", imom: "Бекир", muazzin: "Мухаммад Ш" },
            { date: "22.10", imom: "Мухаммад Аль", muazzin: "Джума" },
            { date: "23.10", imom: "Сурадж", muazzin: "Безирген" },
            { date: "24.10", imom: "Аман", muazzin: "Абу Бакр" },
            { date: "25.10", imom: "Хайрулла", muazzin: "Мухаммад Ш" },
            { date: "26.10", imom: "Махмуд", muazzin: "Джума" },
            { date: "27.10", imom: "Расул", muazzin: "Безирген" },
            { date: "28.10", imom: "Расул", muazzin: "Абу Бакр" },
            { date: "29.10", imom: "Тимур", muazzin: "Мухаммад Ш" },
            { date: "30.10", imom: "Равшан", muazzin: "Джума" },
            { date: "31.10", imom: "Даянч", muazzin: "-" },
            { date: "01.11", imom: "Нурамин", muazzin: "-" }
        ];

        // Oshxona navbatchilari (fayldagi ma'lumotlar)
        const kitchenSchedule = [
            { num: 1, names: "Нурамин и Хайрулла" },
            { num: 2, names: "Сураж и Ресул" },
            { num: 3, names: "Виссам и Махмуд" },
            { num: 4, names: "Бекир и Альбатрон" },
            { num: 5, names: "Осман и Мухамметджума" },
            { num: 6, names: "Мухаммад Котьювар и Аман" },
            { num: 7, names: "Безирген и Шахрур" },
            { num: 8, names: "Ислам и Салахаддин" },
            { num: 9, names: "Кувват и Абу Бакр" },
            { num: 10, names: "Даянч и Ахмад" },
            { num: 11, names: "Тимур и Мухаммадзейид (Александр)" },
            { num: 12, names: "Следующая пара" },
            { num: 13, names: "Следующая пара" }
        ];

        // ================= FUNKSIYALAR =================

        function getTodayInfo() {
            const today = new Date();
            const day = String(today.getDate()).padStart(2, '0');
            const month = String(today.getMonth() + 1).padStart(2, '0');
            return `${day}.${month}`;
        }

        function getFormattedDate() {
            const today = new Date();
            const daysOfWeek = ['Воскресенье', 'Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота'];
            const months = ['Января', 'Февраля', 'Марта', 'Апреля', 'Мая', 'Июня', 'Июля', 'Августа', 'Сентября', 'Октября', 'Ноября', 'Декабря'];
            
            return `${daysOfWeek[today.getDay()]}, ${today.getDate()} ${months[today.getMonth()]} ${today.getFullYear()}`;
        }

        function loadPrayerSchedule() {
            const todayStr = getTodayInfo();
            document.getElementById('today-date-text').innerText = getFormattedDate();

            const todayData = prayerSchedule.find(item => item.date === todayStr);

            if (todayData) {
                document.getElementById('today-imom').innerText = todayData.imom;
                document.getElementById('today-muazzin').innerText = todayData.muazzin;
            } else {
                document.getElementById('today-imom').innerText = "Не назначен";
                document.getElementById('today-muazzin').innerText = "Не назначен";
            }
        }

        function loadKitchenSchedule() {
            const todayStr = getTodayInfo();
            document.getElementById('kitchen-date-text').innerText = getFormattedDate();

            // Bugungi kunni aniqlab, shu kunga mos oshxona navbatchisini topamiz
            const dayIndex = prayerSchedule.findIndex(item => item.date === todayStr);
            
            if (dayIndex !== -1 && kitchenSchedule[dayIndex]) {
                const kitchenData = kitchenSchedule[dayIndex];
                document.getElementById('kitchen-number').innerText = `№ ${kitchenData.num}`;
                document.getElementById('kitchen-names').innerText = kitchenData.names;
            } else {
                document.getElementById('kitchen-number').innerText = "№ -";
                document.getElementById('kitchen-names').innerText = "Не назначены";
            }
        }

        function switchPage(page) {
            const pagePrayer = document.getElementById('page-prayer');
            const pageKitchen = document.getElementById('page-kitchen');
            const headerTitle = document.getElementById('header-title');
            const navBtns = document.querySelectorAll('.nav-btn');

            if (page === 'prayer') {
                pagePrayer.classList.remove('hidden');
                pageKitchen.classList.add('hidden');
                headerTitle.innerText = ' Расписание на сегодня';
                navBtns[0].classList.add('active');
                navBtns[1].classList.remove('active');
            } else {
                pagePrayer.classList.add('hidden');
                pageKitchen.classList.remove('hidden');
                headerTitle.innerText = '🍽️ Кухня на сегодня';
                navBtns[0].classList.remove('active');
                navBtns[1].classList.add('active');
            }
            
            tg.HapticFeedback.impactOccurred('light');
        }

        // Ishga tushirish
        loadPrayerSchedule();
        loadKitchenSchedule();
    </script>
</body>
</html>
